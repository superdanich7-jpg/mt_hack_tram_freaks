version: '3.8'

services:
  # МОДУЛЬ 1: ML-ядро (проверка и валидация прогнозных артефактов)
  ml-core:
    image: python:3.10-slim
    container_name: tram_ml_core
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      sh -c "echo '=== [1/3] Запуск ML-ядра: валидация артефактов ===' &&
             python -c \"import os; assert os.path.exists('submissions/forecast.csv'), 'forecast.csv not found'; print('✓ Модели и прогнозы (submissions/forecast.csv) успешно верифицированы!')\""

  # МОДУЛЬ 2: Backend (FastAPI REST API)
  backend:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    container_name: tram_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./submissions:/app/submissions
      - ./submissions:/submissions
      - ./spravochniki:/app/spravochniki
    depends_on:
      - ml-core
    environment:
      - PYTHONUNBUFFERED=1

  # МОДУЛЬ 3: BI-дашборд (React Web Dashboard)
  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: tram_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend